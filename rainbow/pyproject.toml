[project]
name = "rainbow-challenge"
version = "0.1.0"
description = "Backend for the Rainbow Challenge — a Django REST API."
readme = "readme.md"
requires-python = ">=3.12,<3.13"

# Direct (top-level) dependencies only. These are the packages the project
# imports or configures itself (INSTALLED_APPS / MIDDLEWARE / settings) plus the
# runtime infrastructure (DB driver, Celery broker, WSGI server, image library).
# Transitive dependencies are resolved and pinned in uv.lock — do not list them
# here. The lower bounds are the versions the project was last verified
# against; `uv lock --upgrade` takes newer ones.
dependencies = [
    # Django + DRF stack
    # 5.2 is the LTS line (security support until April 2028). Django 6.x is
    # out but not LTS, so we stay here until 6.2 LTS unless something forces a
    # move; the bound keeps a `uv lock --upgrade` from jumping lines silently.
    "Django>=5.2,<5.3",
    "djangorestframework>=3.18.0",
    "djoser>=2.3.4",
    "drf-spectacular>=0.30.0",
    # Django apps (INSTALLED_APPS / MIDDLEWARE)
    "django-cors-headers>=4.9.0",
    "django-extensions>=4.1",
    # The xlsx/ods extras pull the tablib backends for those formats. Version 4
    # stopped depending on them, and without them the admin's export screen
    # silently offers CSV/JSON only. The legacy .xls backend (xlwt) is gone for
    # good — Excel reads .xlsx.
    "django-import-export[ods,xlsx]>=4.4.1",
    "django-modeltranslation>=0.20.3",
    "django-nested-inline>=0.4.6",
    "django-otp>=1.7.0",
    "django-private-storage>=3.1.3",
    "django-widget-tweaks>=1.5.1",
    "django-advanced-password-validation>=1.2.0",
    # Stuck on 5.x: djoser requires social-auth-app-django<6, and 5.9 in turn
    # caps social-auth-core at <5. Both move once djoser allows 6.x. This is
    # past the version Dependabot's associate-by-email advisory asked for.
    "social-auth-app-django>=5.9.0",
    # Async tasks + cache/broker
    "celery>=5.6.3",
    "redis>=8.1.0",
    # Runtime infrastructure
    "psycopg2-binary>=2.9.12",
    "gunicorn>=26.0.0",
    "pillow>=12.3.0",
    # Push notifications / Firebase
    "firebase-admin>=7.5.0",
    # 3.x ships two migrations the old version did not (a unique constraint on
    # registration_id and an index): run `manage.py migrate fcm_django`.
    "fcm-django>=3.2.0",
    # Misc libraries imported directly in the code
    "qrcode>=8.2",
    "requests>=2.34.2",
    "httpx>=0.28.1",
    # Security floor: >=2.13.0 fixes the HS256/JWK algorithm-confusion advisory
    # (GHSA / Dependabot). Kept as a floor so future security patches resolve.
    "PyJWT>=2.13.0",
    "python-dotenv>=1.2.2",
    "isoweek>=1.3.3",
]

[dependency-groups]
# Dev/test tooling. `uv sync` installs these by default; use
# `uv sync --no-dev` for a production install.
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "model-bakery>=1.24.0",
    "factory-boy>=3.3.3",
    "ruff>=0.16.3",
]

[tool.uv]
# This is a Django project, not an installable library — don't try to build it.
package = false
# Preserve the security floor the maintainer set in recent commits (the
# cryptography 46 / cffi bump). uv resolves cffi to a compatible version.
constraint-dependencies = ["cryptography>=46.0.7"]
